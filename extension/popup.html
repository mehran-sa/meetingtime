<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Meeting Tracker</title>
  <link rel="stylesheet" href="popup.css" />
  <script src="brand-config.js" defer></script>
  <script src="core.js" defer></script>
  <script src="store.js" defer></script>
  <script src="capture.js" defer></script>
  <script src="popup.js" defer></script>
</head>
<body class="popup">
  <header class="bar">
    <img src="icons/icon.svg" alt="" width="28" height="28" />
    <h1>Meeting Tracker</h1>
    <button id="settingsBtn" class="icon-btn" type="button" aria-label="Settings" title="Settings">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M4 7h9m5 0h2M4 17h2m5 0h9"/><circle cx="15.500" cy="7" r="2.500" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="8.500" cy="17" r="2.500" fill="none" stroke="currentColor" stroke-width="2"/></svg>
    </button>
  </header>

  <!-- List of tracked meetings -->
  <main id="listView">
    <div class="capture-row">
      <button id="captureBtn" class="btn btn-primary" type="button">Track meeting from this page</button>
      <button id="addBtn" class="btn btn-secondary" type="button">Add by hand</button>
    </div>
    <p id="tabHint" class="hint" hidden></p>
    <div id="meetingList" class="meeting-list" aria-live="polite"></div>
  </main>

  <!-- Add or edit one meeting -->
  <main id="formView" hidden>
    <div class="form-heading">
      <h2 id="formTitle">Check the details</h2>
      <button id="cancelBtn" class="text-btn" type="button">Cancel</button>
    </div>
    <p id="formHint" class="hint" hidden></p>

    <form id="meetingForm" class="form-grid" novalidate>
      <label class="field full"><span>Brand</span>
        <select id="brand"></select>
      </label>
      <label class="field"><span>Meeting with <span class="optional">optional</span></span>
        <input id="partnerBrand" type="text" placeholder="Partner brand" />
      </label>
      <label class="field"><span>Email <span class="optional">for the reminder</span></span>
        <input id="email" type="email" placeholder="name@partner.com" autocomplete="off" />
      </label>
      <label class="field"><span>Date</span>
        <input id="date" type="date" required />
      </label>
      <label class="field"><span>Time zone shown</span>
        <select id="timezone"></select>
      </label>
      <label class="field"><span>Starts</span>
        <input id="time" type="time" required />
      </label>
      <label class="field"><span>Ends <span class="optional">optional</span></span>
        <input id="endTime" type="time" />
      </label>
      <label class="field full"><span>Meeting link</span>
        <input id="meetingLink" type="url" placeholder="https://meet.google.com/…" required />
      </label>
      <label class="field full"><span>Note <span class="optional">optional</span></span>
        <input id="note" type="text" placeholder="Anything the representative should know" />
      </label>

      <div id="formTicket" class="mini-ticket full is-empty" aria-live="polite">
        <span class="mini-label">In Bangladesh</span>
        <strong id="formTicketTime">Add a date and start time</strong>
      </div>
      <p id="formError" class="form-error full" role="alert" hidden></p>

      <div class="form-actions full">
        <button id="saveBtn" class="btn btn-primary" type="submit">Save meeting</button>
        <button id="saveCopyBtn" class="btn btn-secondary" type="button">Save and copy reminder</button>
      </div>
      <button id="openToolBtn" class="text-btn full" type="button" hidden>Open in the full reminder tool</button>
    </form>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
