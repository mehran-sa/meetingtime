<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meeting Tracker settings</title>
  <link rel="icon" href="icons/icon-32.png" />
  <link rel="stylesheet" href="popup.css" />
  <script src="brand-config.js" defer></script>
  <script src="core.js" defer></script>
  <script src="store.js" defer></script>
  <script src="options.js" defer></script>
</head>
<body class="options">
  <form id="optionsForm" class="options-shell">
    <header>
      <img src="icons/icon.svg" alt="" width="36" height="36" />
      <h1>Meeting Tracker settings</h1>
    </header>

    <section class="card">
      <h2 class="section-title">Reminders</h2>
      <div class="setting-row">
        <label for="notify">Remind me before each meeting</label>
        <input id="notify" type="checkbox" />
      </div>
      <div class="setting-row">
        <label for="leadMinutes">How long before</label>
        <select id="leadMinutes">
          <option value="5">5 minutes</option>
          <option value="10">10 minutes</option>
          <option value="15">15 minutes</option>
          <option value="30">30 minutes</option>
          <option value="60">1 hour</option>
        </select>
      </div>
    </section>

    <section class="card">
      <h2 class="section-title">Representatives</h2>
      <p>Who each brand's reminder greets. Add a Slack member ID to @mention them.</p>
      <table class="rep-table">
        <thead><tr><th scope="col">Brand</th><th scope="col">Name</th><th scope="col">Slack member ID</th></tr></thead>
        <tbody id="repRows"></tbody>
      </table>
    </section>

    <section class="card">
      <h2 class="section-title">Stored meetings</h2>
      <p>Meetings are kept only in this browser and removed a week after they end.</p>
      <div class="data-row">
        <span id="meetingCount">No meetings stored</span>
        <button id="deleteAllBtn" class="btn btn-outline btn-small" type="button">Delete all meetings</button>
      </div>
    </section>

    <div class="save-bar">
      <button class="btn btn-primary" type="submit">Save settings</button>
      <span id="saveStatus" role="status" aria-live="polite"></span>
    </div>
  </form>
</body>
</html>
